name: Reference checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: example-dapp
    env:
      CI: 'true'
      # Several upstream packages publish source maps without the referenced sources.
      GENERATE_SOURCEMAP: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: example-dapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run tsc
      - run: npm run build
